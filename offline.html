<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline - Attendance System | The Legacy Institute</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
            background: linear-gradient(135deg, #8cb300 0%, #6d8c00 50%, #5a7300 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .offline-container {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .offline-icon {
            width: 100px;
            height: 100px;
            background: #f0f7e8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: pulse 2s infinite;
        }

        .offline-icon i {
            font-size: 50px;
            color: #8cb300;
        }

        h1 {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .info-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .info-box p {
            color: #475569;
            font-size: 13px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .info-box i {
            color: #8cb300;
            font-size: 18px;
        }

        .retry-btn {
            background: #8cb300;
            color: #ffffff;
            border: none;
            padding: 14px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .retry-btn:hover {
            background: #6d8c00;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(140, 179, 0, 0.3);
        }

        .brand-footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            color: #94a3b8;
            font-size: 12px;
        }

        .brand-footer strong {
            color: #8cb300;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        @media (max-width: 480px) {
            .offline-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .offline-icon {
                width: 80px;
                height: 80px;
            }

            .offline-icon i {
                font-size: 40px;
            }
        }
    </style>
</head>

<body>
    <div class="offline-container">
        <div class="offline-icon">
            <i class='bx bx-wifi-off'></i>
        </div>
        <h1>You're Offline</h1>
        <p class="subtitle">
            Unable to connect to the Attendance System. Please check your internet connection and try again.
        </p>
        <div class="info-box">
            <p>
                <i class='bx bx-info-circle'></i>
                The Attendance System requires an active internet connection to record and sync your sessions.
            </p>
        </div>
        <button class="retry-btn" onclick="window.location.reload()">
            <i class='bx bx-refresh'></i>
            Retry Connection
        </button>
        <div class="brand-footer">
            <strong>The Legacy Institute</strong><br>
            Attendance Management System<br>
            Developed by Aaqib's DevDesk
        </div>
    </div>

    <script>
        // Auto-retry when back online
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>

</html>
